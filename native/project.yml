name: Ablage
options:
  bundleIdPrefix: com.philipphoang
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Ablage:
    type: application
    platform: iOS
    sources: [App, Shared, Keyboard/KeyboardView.swift, Keyboard/KeyboardModel.swift]
    resources: [App/Assets.xcassets]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ablage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: Ablage übernimmt neue Bildschirmfotos automatisch in den Verlauf.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [ablage]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Ablage.entitlements
      properties:
        com.apple.security.application-groups: [group.com.philipphoang.ablage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philipphoang.ablage
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AblageKeyboard
        embed: true
  AblageKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Ablage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: Ablage übernimmt neue Bildschirmfotos automatisch in den Verlauf.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: de-DE
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/AblageKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.philipphoang.ablage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philipphoang.ablage.keyboard
  AblageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, Shared/Models.swift, Shared/Detect.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.philipphoang.ablage.tests
schemes:
  Ablage:
    build:
      targets: {Ablage: all, AblageKeyboard: all}
    test:
      targets: [AblageTests]
